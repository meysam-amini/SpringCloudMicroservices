# a random port number will be assigned for each instance of app:
server:
  port: 3333
#${PORT:0}
spring:
  application:
    name: users-ws

#eureka:
#  instance:
#    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
#  client:
#    service-url:
#      # the url by which the client apps communicate with Eureka server
#      defaultZone: http://localhost:8010/eureka

  data:
    redis:
      host: localhost
      port: 6379
      password: ######
      connect-timeout: 10000
      timeout: 10000
      jedis:
        pool:
          enabled: true
          max-active: 300
          max-wait: 5000
          max-idle: 100
          min-idle: 20

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:8080/realms/meysam
      client:
        registration:
          keycloak:
            client-id: spring-cloud-microservices
            #            authorization-grant-type: password
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://127.0.0.1:8080/realms/meysam
            user-name-attribute: preferred_username