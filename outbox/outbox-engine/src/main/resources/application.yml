spring:
  application:
    name: outbox-engine

  datasource:
    # --- Oracle (commented out) ---
    # url: jdbc:oracle:thin:@10.2.10.20:1521:dbdev
    # username: eeeee
    # password: eeee
    # driver-class-name: oracle.jdbc.OracleDriver

    # --- H2---
    url: jdbc:h2:file:./data/outbox;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    # database: oracle   # was for Oracle, remove/comment for H2
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update   # was 'none'; with H2 you want schema auto-created

  data:
    redis:
      host: localhost
      port: 6379
      password: ######
      connect-timeout: 10000
      timeout: 10000
      jedis:
        pool:
          enabled: true
          max-active: 300
          max-wait: 5000
          max-idle: 100
          min-idle: 20

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss.SSS"
    time-zone: Asia/Tehran

server:
  port: 4444
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: refresh

logging:
  appender:
    console:
      enabled: true
    logstash:
      enabled: true
      destination:
        url:
        port:
  level:
    root: info

notification:
  sms:
    enabled: true
    provider:
      # authorization-header: XXXXX
      uri: https://test.sms.com/api/http/sms/v2/send
    sender-number: 30000059
  email:
    enabled: false
    provider:
      uri:

web:
  client:
    time-out:
      connection: 10000
      response: 10000

outbox:
  processing:
    page:
      size: 100
  retry:
    count: 3